[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "football-analysis-system"
version = "0.2.0"
description = "AI-powered Football Video Analysis System using YOLO, ByteTrack, OpenCV, and Scikit-Learn"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "ultralytics>=8.3.0",
    "supervision>=0.24.0",
    "opencv-python>=4.10.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "matplotlib>=3.8.0",
    "pillow>=10.2.0",
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "roboflow>=1.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
